server {
    listen 80;
    server_name consultorio.nexosoft.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://consultorio.nexosoft.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name consultorio.nexosoft.tech;

    ssl_certificate /etc/letsencrypt/live/consultorio.nexosoft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consultorio.nexosoft.tech/privkey.pem;

    client_max_body_size 12m;

    location = /api/health {
        proxy_pass http://consultorio-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://consultorio-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://consultorio-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

