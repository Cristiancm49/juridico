services:
  postgres:
    image: postgres:16-alpine
    container_name: legaldesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legaldesk
      POSTGRES_USER: legaldesk
      POSTGRES_PASSWORD: legaldesk
    ports:
      - "55432:5432"
    volumes:
      - legaldesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldesk -d legaldesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: legaldesk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: legaldesk
      MINIO_ROOT_PASSWORD: legaldesk-local-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - legaldesk_minio_data:/data

volumes:
  legaldesk_postgres_data:
  legaldesk_minio_data:
